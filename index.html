<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prnt.sc Turbo Roulette</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --sub-accent: #f59e0b;
      --sub-accent-hover: #d97706;
      --stop-accent: #ef4444;
      --stop-hover: #dc2626;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    .url-box {
      font-size: 1.25rem;
      font-weight: bold;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin: 20px 0;
      word-break: break-all;
      color: var(--accent);
    }
    .status {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 15px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    button, a.btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover, a.btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-var {
      background: var(--sub-accent);
      color: #000;
    }
    .btn-var:hover {
      background: var(--sub-accent-hover);
      color: #fff;
    }
    .btn-auto {
      background: #10b981;
      color: #fff;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
    }
    .btn-auto:hover {
      background: #059669;
    }
    .btn-auto.stop {
      background: var(--stop-accent);
    }
    .btn-auto.stop:hover {
      background: var(--stop-hover);
    }
    .history {
      margin-top: 25px;
      text-align: left;
    }
    .history h2 { font-size: 1.1rem; color: var(--muted); }
    ul {
      list-style: none;
      padding: 0;
      max-height: 150px;
      overflow-y: auto;
    }
    li {
      padding: 6px 0;
      border-bottom: 1px solid #334155;
      font-size: 0.9rem;
    }
    li a { color: var(--accent); text-decoration: none; }
    li a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Prnt.sc Turbo Roulette</h1>
    <p style="color: var(--muted); font-size: 0.9rem;">Munjevito brzo generisanje i menjanje linkova</p>

    <div class="url-box" id="urlDisplay">https://prnt.sc/xxxxxx</div>
    <div class="status" id="statusText">Turbo režim spreman ⚡</div>

    <div class="btn-group">
      <button onclick="generateFullRandom()">Potpuno Novi ID</button>
      <button class="btn-var" onclick="tweakLastTwo()">Zadnja 2</button>
      <a id="openBtn" href="#" target="_blank" class="btn">Otvori ↗</a>
    </div>

    <div>
      <button id="autoBtn" class="btn-auto" onclick="toggleTurboAuto()">Pokreni Turbo Auto-Roll 🚀</button>
    </div>

    <div class="history">
      <h2>Istorija Linkova</h2>
      <ul id="historyList"></ul>
    </div>
  </div>

  <script>
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let currentCode = '';
    let autoInterval = null;

    function getRandomChar() {
      return chars.charAt(Math.floor(Math.random() * chars.length));
    }

    function generateFullRandom() {
      let result = '';
      for (let i = 0; i < 6; i++) {
        result += getRandomChar();
      }
      currentCode = result;
      updateDisplay();
    }

    function tweakLastTwo() {
      if (!currentCode || currentCode.length !== 6) {
        generateFullRandom();
        return;
      }
      const firstFour = currentCode.substring(0, 4);
      const newLastTwo = getRandomChar() + getRandomChar();
      currentCode = firstFour + newLastTwo;
      updateDisplay();
    }

    function updateDisplay() {
      const fullUrl = `https://prnt.sc/${currentCode}`;
      document.getElementById('urlDisplay').textContent = fullUrl;
      document.getElementById('openBtn').href = fullUrl;

      // Dodaj u istoriju
      const historyList = document.getElementById('historyList');
      const li = document.createElement('li');
      li.innerHTML = `<a href="${fullUrl}" target="_blank">${fullUrl}</a>`;
      historyList.prepend(li);
    }

    // Turbo automatsko vrtenje (menja linkove svake sekunde bez čekanja proxy-ja)
    function toggleTurboAuto() {
      const autoBtn = document.getElementById('autoBtn');
      const statusText = document.getElementById('statusText');

      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
        autoBtn.textContent = 'Pokreni Turbo Auto-Roll 🚀';
        autoBtn.classList.remove('stop');
        statusText.textContent = 'Zaustavljeno.';
      } else {
        autoBtn.textContent = 'Zaustavi Turbo-Roll ⏹';
        autoBtn.classList.add('stop');
        statusText.textContent = 'Turbo Auto-Roll aktivan (vrti na svakih 0.8s)...';
        
        autoInterval = setInterval(() => {
          tweakLastTwo();
        }, 800); // Mijenja svake 0.8 sekunde - super brzo!
      }
    }

    // Generiši prvu sliku pri učitavanju
    generateFullRandom();
  </script>
</body>
</html>
